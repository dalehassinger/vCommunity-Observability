services:
  vco:
    build:
      context: .
      target: core-pwsh        # use "core" if you only run Python modules
      args:
        PWSH_VERSION: ${PWSH_VERSION:-7.6.9}  # set PWSH_VERSION in .env to pin another PowerShell build
        # Set DOTNET_HWINTRINSIC=0 in .env if PowerShell fails with "Illegal instruction"
        # (seen in some Mac VMs, e.g. Rancher Desktop). 1 is the normal default.
        DOTNET_EnableHWIntrinsic: ${DOTNET_HWINTRINSIC:-1}
    image: vcommunity-observability:core-pwsh-0.1.0
    container_name: vco
    ports:
      - "8080:8080"
      # Syslog server (Logs module). Hosts send to this computer on port 514; inside the
      # container the listener uses 5514, so it needs no root. Set SYSLOG_PORT in .env to use
      # another host port (e.g. 1514 if your container runtime can't open ports below 1024).
      - "${SYSLOG_PORT:-514}:5514/udp"
      - "${SYSLOG_PORT:-514}:5514/tcp"
    env_file: .env
    volumes:
      - ./data:/app/data                                  # SQLite files survive upgrades
      - ./exports:/app/exports                            # scheduled exports land here (Settings page)
      - ./extra-modules:/modules                          # drop new or patched modules here
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./control:/app/control                            # Apps on / off switches, shared with vco-ask
    environment:
      VCO_CONFIG: /app/config/config.yaml
      VCO_EXPORT_DIR: /app/exports
      VCO_ASK_URL: ${VCO_ASK_URL:-http://localhost:8081}   # sidebar link to vCommunity Ask (empty = hide)
      VCO_ASK_INTERNAL_URL: http://vco-ask:8081           # Apple HomeView's Ask page reads answers here (with ASK_API_TOKEN)
      VCO_SYSLOG_HOST_PORT: ${SYSLOG_PORT:-514}             # shown in the Logs setup examples
      # TZ: America/New_York                              # default time zone offered for scheduled exports
    restart: unless-stopped
    init: true               # tiny init (tini) reaps finished collector subprocesses and passes stop signals

  # vCommunity Ask: chat UI answered by your local Ollama from your own knowledge
  # sources (see ask/README section in README.md). Python only; no PowerShell.
  vco-ask:
    build:
      context: .                 # repo root: the image reuses core/static (theme, Swagger UI)
      dockerfile: ask/Dockerfile
    image: vcommunity-ask:0.1.0
    container_name: vco-ask
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      # Ollama runs on the Mac itself (it uses the GPU there). Rancher Desktop (moby)
      # and Docker Desktop reach the Mac at host.docker.internal.
      ASK_OLLAMA_URL: ${ASK_OLLAMA_URL:-http://host.docker.internal:11434}
      # MCP servers Ask calls over HTTP (MCP tools page wins): the draw.io MCP container below.
      ASK_MCP_HTTP_SERVERS: ${ASK_MCP_HTTP_SERVERS:-drawio=http://drawio-mcp:3001/mcp}
      # "Open in draw.io" links go to the local draw.io editor below, not app.diagrams.net
      # (the address your browser opens; MCP tools page wins; empty = public editor).
      ASK_DRAWIO_URL: ${ASK_DRAWIO_URL:-http://localhost:8082}
    # Linux Docker hosts only: uncomment so host.docker.internal resolves. Do NOT use it on
    # Rancher Desktop or Docker Desktop: it overrides their own mapping to the Mac and Ollama is refused.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - ./ask-data:/app/data                   # ask.db (index + chats) and cloned repositories
      - ./ask-knowledge:/knowledge:ro          # optional: local markdown folders for "local folder" sources
      - ./ask-sources:/sources                 # optional: extra or patched source plug-ins
      - ./exports:/exports:ro                  # the dashboards' exports, read by "spreadsheet" sources
      - ./control:/app/control                 # Apps on / off switches, shared with vco
      - ./drawio-libs:/app/drawio-libs:ro      # your draw.io shape libraries (*.xml) for diagrams Ask makes
      # - ./ask/config/ask.yaml:/app/config/ask.yaml:ro   # optional: your own copy of ask.example.yaml
    restart: unless-stopped
    init: true

  # draw.io MCP server (jgraph/drawio-mcp): lets MCP clients on the Mac (Claude Code, Claude
  # Desktop, VS Code) and vCommunity Ask (http://drawio-mcp:3001/mcp) create draw.io diagrams. Same as
  #   docker run -d --name drawio-mcp -p 127.0.0.1:3001:3001 jgraph/drawio-mcp
  # The Mac reaches it at 127.0.0.1:3001 only (not the network); vco-ask by its name on the compose
  # network. Start only this one: docker compose up -d drawio-mcp
  drawio-mcp:
    image: ${DRAWIO_MCP_IMAGE:-jgraph/drawio-mcp:latest}
    container_name: drawio-mcp
    ports:
      - "127.0.0.1:${DRAWIO_MCP_PORT:-3001}:3001"
    restart: unless-stopped
    init: true

  # draw.io editor (jgraph/drawio, Apache-2.0): the full diagrams.net editor served from this
  # container, so the diagrams Ask makes with the draw.io MCP server open without the internet.
  # http://localhost:8082 on the Mac. Start only this one: docker compose up -d drawio
  drawio:
    image: ${DRAWIO_IMAGE:-jgraph/drawio:latest}
    container_name: drawio
    ports:
      - "127.0.0.1:${DRAWIO_PORT:-8082}:8080"
    restart: unless-stopped
    init: true
