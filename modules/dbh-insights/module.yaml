api:
- path: /sheets
  query: SELECT vcenter, position, sheet, grp AS sheet_group, table_name, row_count, error, collected_at FROM sheets ORDER BY vcenter, position
  description: Every sheet with its row count and any collection error
- path: /vinfo
  table: vinfo
  description: vInfo sheet (Virtual machines)
- path: /vcpu
  table: vcpu
  description: vCPU sheet (Virtual machines)
- path: /vmemory
  table: vmemory
  description: vMemory sheet (Virtual machines)
- path: /vdisk
  table: vdisk
  description: vDisk sheet (Virtual machines)
- path: /vpartition
  table: vpartition
  description: vPartition sheet (Virtual machines)
- path: /vnetwork
  table: vnetwork
  description: vNetwork sheet (Virtual machines)
- path: /vsnapshot
  table: vsnapshot
  description: vSnapshot sheet (Virtual machines)
- path: /vcd
  table: vcd
  description: vCD sheet (Virtual machines)
- path: /vusb
  table: vusb
  description: vUSB sheet (Virtual machines)
- path: /vtools
  table: vtools
  description: vTools sheet (Virtual machines)
- path: /vhost
  table: vhost
  description: vHost sheet (Inventory)
- path: /vcluster
  table: vcluster
  description: vCluster sheet (Inventory)
- path: /vrp
  table: vrp
  description: vRP sheet (Inventory)
- path: /vdatastore
  table: vdatastore
  description: vDatastore sheet (Inventory)
- path: /vhealth
  table: vhealth
  description: vHealth sheet (Health)
- path: /vhba
  table: vhba
  description: vHBA sheet (Host network & storage)
- path: /vnic
  table: vnic
  description: vNIC sheet (Host network & storage)
- path: /vswitch
  table: vswitch
  description: vSwitch sheet (Host network & storage)
- path: /vport
  table: vport
  description: vPort sheet (Host network & storage)
- path: /vsc-vmk
  table: vsc_vmk
  description: vSC_VMK sheet (Host network & storage)
- path: /dvswitch
  table: dvswitch
  description: dvSwitch sheet (Distributed switch)
- path: /dvport
  table: dvport
  description: dvPort sheet (Distributed switch)
- path: /vhost-performance
  table: vhost_performance
  description: vHost Performance sheet (Performance)
- path: /vinfo-performance
  table: vinfo_performance
  description: vInfo Performance sheet (Performance)
- path: /vsource
  table: vsource
  description: vSource sheet (System)
- path: /vlicense
  table: vlicense
  description: vLicense sheet (System)
- path: /vmetadata
  table: vmetadata
  description: vMetaData sheet (System)
- path: /cluster-capacity
  table: cluster_capacity
  description: Cluster Capacity sheet (Overview)
- path: /vhealth/by-type
  query: SELECT message_type, COUNT(*) AS findings FROM vhealth GROUP BY message_type ORDER BY findings DESC
  description: vHealth findings counted by type
- path: /vinfo/powered-off
  query: SELECT * FROM vinfo WHERE powerstate = 'poweredOff' AND template = 0
  description: Powered-off VMs (not templates)
- path: /vdatastore/low-free
  query: SELECT * FROM vdatastore WHERE free_pct < 20 ORDER BY free_pct
  description: Datastores under 20% free
dashboards:
- slug: insights
  title: DBH Insights
  template: insights.html
  queries:
    hosts: SELECT * FROM vhost
    clusters: SELECT * FROM cluster_capacity
    datastores: SELECT * FROM vdatastore
    source: SELECT * FROM vsource
    health: SELECT message_type, COUNT(*) AS findings FROM vhealth GROUP BY message_type ORDER BY findings DESC
    sheets: SELECT * FROM sheets ORDER BY vcenter, position
- slug: sheets
  title: DBH Sheets
  template: sheets.html
  queries:
