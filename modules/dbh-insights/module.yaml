# DBH Insights as a vCommunity-Observability module.
# Port of https://github.com/DBH-Insights/DBH-Insights (collect/js/sheets.js and xlsx.js):
# the same 27 inventory sheets plus Cluster Capacity, collected with pyVmomi on a
# schedule instead of from the browser, stored in SQLite, served as REST endpoints
# for MP Builder, and exported as the same XLSX workbook.
#
# The tables: section is generated from sheets.py. After changing a sheet, run
#   python sheets.py --tables
# and paste the result over it (scripts/smoke_test.py checks they match).
name: dbh-insights
version: 0.1.0
core_api: 1
description: DBH Insights inventory sheets (vInfo, vHost, vDisk... 27 in all) with Insights, Sheets and XLSX export.

settings_help:
  vcenter_name: Name shown in the "VI SDK Server" column when only one vCenter is selected (default is the host)
  vcenters: Optional list of vCenter connection ids to collect; empty means all

collectors:
  - name: sheets
    script: collect_dbh.py
    interval_minutes: 30
    timeout_seconds: 900
    connections: [vcenter]
    tables: [sheets, sheet_columns, vinfo, vcpu, vmemory, vdisk, vpartition, vnetwork, vsnapshot, vcd, vusb, vtools, vhost, vcluster, vrp, vdatastore, vhealth, vhba, vnic, vswitch, vport, vsc_vmk, dvswitch, dvport, vhost_performance, vinfo_performance, vsource, vlicense, vmetadata, cluster_capacity]

exports:
  - name: xlsx
    title: Export XLSX
    script: export_dbh.py
    filename: dbh-insights-{timestamp}.xlsx
    media_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  - name: csv
    title: Export one sheet as CSV
    script: export_dbh.py
    params: [sheet]
    filename: dbh-insights-{sheet}-{timestamp}.csv
    media_type: text/csv; charset=utf-8

